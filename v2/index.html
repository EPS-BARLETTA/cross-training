<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross Training</title>
<style>body{margin:0;background:#0d1220;color:#e5e7eb;font:18px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}a{color:#34d399}</style>
<script>
  // Cross Training v2 est maintenant à l'adresse principale : on y va (les résultats sont gardés).
  (function () {
    var go = function () { location.replace("../" + (location.hash || "")); };
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.filter(function (r) { return /\/v2\/$/.test(r.scope); }).map(function (r) { return r.unregister(); }));
        }).then(go, go);
        setTimeout(go, 1500);
        return;
      }
    } catch (e) {}
    go();
  })();
</script>
</head>
<body><p>Cross Training a déménagé…<br><a href="../">Ouvrir Cross Training</a></p></body>
</html>
